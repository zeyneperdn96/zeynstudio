<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Weather - Interactive Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .demo-container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        /* Phone Frame */
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 3rem;
            padding: 1rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            flex-shrink: 0;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 1.5rem 1.5rem;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #0a0e27;
            border-radius: 2.5rem;
            overflow: hidden;
            position: relative;
        }

        /* Screen Container */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
            background: linear-gradient(135deg, #0a0e27 0%, #141937 100%);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-height: 844px;
            overflow-y: auto;
        }

        .controls-header {
            margin-bottom: 2rem;
        }

        .controls-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .controls-header p {
            color: #666;
        }

        .screen-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .screen-category {
            margin-bottom: 1.5rem;
        }

        .category-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.125rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        .screen-btn {
            width: 100%;
            padding: 1rem 1.5rem;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .screen-btn:hover {
            background: #e8e8e8;
            transform: translateX(4px);
        }

        .screen-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .screen-icon {
            font-size: 1.5rem;
        }

        .screen-info {
            flex: 1;
        }

        .screen-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .screen-desc {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        /* Common Styles for Screens */
        .screen-content {
            padding: 1rem;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            margin-bottom: 1rem;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        /* Splash Screen */
        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 2rem;
        }

        .splash-logo {
            font-size: 8rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .splash-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .splash-subtitle {
            color: #a0a8d4;
            font-size: 1.125rem;
        }

        /* Onboarding */
        .onboarding-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 2rem;
        }

        .onboarding-illustration {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
        }

        .onboarding-text {
            text-align: center;
            margin-bottom: 2rem;
        }

        .onboarding-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
        }

        .onboarding-description {
            color: #a0a8d4;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .onboarding-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .dot.active {
            width: 24px;
            border-radius: 4px;
            background: #6366f1;
        }

        /* Login */
        .login-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            height: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #a0a8d4;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            color: #a0a8d4;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: #6b7299;
        }

        /* Mood Grid */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .mood-card {
            background: #1e2547;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mood-card:hover {
            transform: translateY(-4px);
            border-color: #6366f1;
        }

        .mood-card.selected {
            border-color: #6366f1;
            background: #141937;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .mood-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .mood-label {
            font-weight: 600;
            color: white;
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .demo-container {
                flex-direction: column;
                align-items: center;
            }

            .controls-panel {
                width: 100%;
                max-width: 600px;
            }
        }

        @media (max-width: 480px) {
            .phone-frame {
                width: 100%;
                max-width: 390px;
                height: auto;
                aspect-ratio: 390 / 844;
            }

            body {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="demo-container">
        <!-- Phone Frame -->
        <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-screen" id="phoneScreen">
                <!-- Screens will be dynamically loaded here -->
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <div class="controls-header">
                <h1>🌤️ Mood Weather Demo</h1>
                <p>Explore all screens - Every stage, every detail</p>
            </div>

            <div class="screen-list">
                <!-- Welcome Flow -->
                <div class="screen-category">
                    <div class="category-title">🎬 Welcome Flow</div>
                    <button class="screen-btn active" data-screen="splash">
                        <span class="screen-icon">✨</span>
                        <div class="screen-info">
                            <div class="screen-name">Splash Screen</div>
                            <div class="screen-desc">Initial loading screen</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="onboarding1">
                        <span class="screen-icon">📱</span>
                        <div class="screen-info">
                            <div class="screen-name">Onboarding 1</div>
                            <div class="screen-desc">Daily tracking intro</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="onboarding2">
                        <span class="screen-icon">🔥</span>
                        <div class="screen-info">
                            <div class="screen-name">Onboarding 2</div>
                            <div class="screen-desc">Streak system intro</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="onboarding3">
                        <span class="screen-icon">📊</span>
                        <div class="screen-info">
                            <div class="screen-name">Onboarding 3</div>
                            <div class="screen-desc">Statistics intro</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="login">
                        <span class="screen-icon">🔐</span>
                        <div class="screen-info">
                            <div class="screen-name">Login / Sign Up</div>
                            <div class="screen-desc">Authentication screen</div>
                        </div>
                    </button>
                </div>

                <!-- Main Screens -->
                <div class="screen-category">
                    <div class="category-title">🏠 Main Screens</div>
                    <button class="screen-btn" data-screen="home-empty">
                        <span class="screen-icon">🌤️</span>
                        <div class="screen-info">
                            <div class="screen-name">Home (Empty)</div>
                            <div class="screen-desc">First use state</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-select">
                        <span class="screen-icon">☀️</span>
                        <div class="screen-info">
                            <div class="screen-name">Mood Selection</div>
                            <div class="screen-desc">6 different options</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="note-add">
                        <span class="screen-icon">📝</span>
                        <div class="screen-info">
                            <div class="screen-name">Add Note</div>
                            <div class="screen-desc">Daily note writing</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="success">
                        <span class="screen-icon">✅</span>
                        <div class="screen-info">
                            <div class="screen-name">Success Message</div>
                            <div class="screen-desc">Save confirmation</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="home-filled">
                        <span class="screen-icon">📅</span>
                        <div class="screen-info">
                            <div class="screen-name">Home (Filled)</div>
                            <div class="screen-desc">With weekly data</div>
                        </div>
                    </button>
                </div>

                <!-- Analytics & History -->
                <div class="screen-category">
                    <div class="category-title">📊 Analytics & History</div>
                    <button class="screen-btn" data-screen="calendar">
                        <span class="screen-icon">📆</span>
                        <div class="screen-info">
                            <div class="screen-name">Monthly Calendar</div>
                            <div class="screen-desc">Full month view</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="analytics">
                        <span class="screen-icon">📈</span>
                        <div class="screen-info">
                            <div class="screen-name">Analytics</div>
                            <div class="screen-desc">Charts and statistics</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="history">
                        <span class="screen-icon">🕐</span>
                        <div class="screen-info">
                            <div class="screen-name">History</div>
                            <div class="screen-desc">All records</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="insights">
                        <span class="screen-icon">🤖</span>
                        <div class="screen-info">
                            <div class="screen-name">Insights</div>
                            <div class="screen-desc">AI analysis</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="streak">
                        <span class="screen-icon">🔥</span>
                        <div class="screen-info">
                            <div class="screen-name">Streak Achievement</div>
                            <div class="screen-desc">30 days completed</div>
                        </div>
                    </button>
                </div>

                <!-- Settings & Profile -->
                <div class="screen-category">
                    <div class="category-title">⚙️ Settings & Profile</div>
                    <button class="screen-btn" data-screen="notifications">
                        <span class="screen-icon">🔔</span>
                        <div class="screen-info">
                            <div class="screen-name">Notifications</div>
                            <div class="screen-desc">All notifications</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="settings">
                        <span class="screen-icon">⚙️</span>
                        <div class="screen-info">
                            <div class="screen-name">Settings</div>
                            <div class="screen-desc">All settings</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="profile">
                        <span class="screen-icon">👤</span>
                        <div class="screen-info">
                            <div class="screen-name">Profile</div>
                            <div class="screen-desc">User profile</div>
                        </div>
                    </button>
                </div>

                <!-- Different Moods -->
                <div class="screen-category">
                    <div class="category-title">🎭 Different Moods</div>
                    <button class="screen-btn" data-screen="mood-amazing">
                        <span class="screen-icon">☀️</span>
                        <div class="screen-info">
                            <div class="screen-name">Amazing</div>
                            <div class="screen-desc">Sunny day</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-good">
                        <span class="screen-icon">🌤️</span>
                        <div class="screen-info">
                            <div class="screen-name">Good</div>
                            <div class="screen-desc">Partly cloudy</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-okay">
                        <span class="screen-icon">⛅</span>
                        <div class="screen-info">
                            <div class="screen-name">Okay</div>
                            <div class="screen-desc">Cloudy</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-meh">
                        <span class="screen-icon">☁️</span>
                        <div class="screen-info">
                            <div class="screen-name">Meh</div>
                            <div class="screen-desc">Overcast</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-bad">
                        <span class="screen-icon">🌧️</span>
                        <div class="screen-info">
                            <div class="screen-name">Bad</div>
                            <div class="screen-desc">Rainy</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="mood-terrible">
                        <span class="screen-icon">⛈️</span>
                        <div class="screen-info">
                            <div class="screen-name">Terrible</div>
                            <div class="screen-desc">Stormy</div>
                        </div>
                    </button>
                </div>

                <!-- States -->
                <div class="screen-category">
                    <div class="category-title">🔄 States</div>
                    <button class="screen-btn" data-screen="loading">
                        <span class="screen-icon">⏳</span>
                        <div class="screen-info">
                            <div class="screen-name">Loading</div>
                            <div class="screen-desc">Loading state</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="error">
                        <span class="screen-icon">❌</span>
                        <div class="screen-info">
                            <div class="screen-name">Error</div>
                            <div class="screen-desc">Error state</div>
                        </div>
                    </button>
                    <button class="screen-btn" data-screen="empty">
                        <span class="screen-icon">📭</span>
                        <div class="screen-info">
                            <div class="screen-name">Empty State</div>
                            <div class="screen-desc">Empty state</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="demo.js"></script>
</body>

</html>
