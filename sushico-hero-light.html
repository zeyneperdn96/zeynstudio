<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SushiCo - Fresh Sushi. Fast Delivery.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #F7F6F3;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* ═══════════ HERO SECTION ═══════════ */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 3rem 2rem;
        }

        .hero-container {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* Left Content */
        .hero-content {
            max-width: 540px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .5rem 1rem;
            background: #fff;
            border-radius: 50px;
            font-size: .8125rem;
            font-weight: 500;
            color: #C41E24;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .hero-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #C41E24;
            border-radius: 50%;
        }

        .hero-headline {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.02em;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            font-size: 1.125rem;
            line-height: 1.7;
            color: rgba(26, 26, 26, .65);
            margin-bottom: 2.5rem;
            max-width: 480px;
        }

        /* CTA Buttons */
        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .875rem 1.75rem;
            font-size: .9375rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all .3s ease;
            border: none;
            cursor: pointer;
            letter-spacing: .01em;
        }

        .btn-primary {
            background: #C41E24;
            color: #fff;
            box-shadow: 0 4px 12px rgba(196, 30, 36, .2);
        }

        .btn-primary:hover {
            background: #A01820;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 30, 36, .3);
        }

        .btn-secondary {
            background: #fff;
            color: #1a1a1a;
            border: 1.5px solid rgba(26, 26, 26, .12);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .btn-secondary:hover {
            background: #fff;
            border-color: rgba(26, 26, 26, .2);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Right Image */
        .hero-image {
            position: relative;
            display: flex;
            justify-content: flex-end;
        }

        .image-card {
            position: relative;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 4/5;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .08);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Floating Badge */
        .floating-badge {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, .95);
            backdrop-filter: blur(12px);
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
            min-width: 200px;
        }

        .floating-badge-title {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: rgba(26, 26, 26, .5);
            margin-bottom: .375rem;
            font-weight: 600;
        }

        .floating-badge-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #C41E24;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .floating-badge-value svg {
            width: 20px;
            height: 20px;
        }

        /* Decorative Elements */
        .hero-decoration {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(196, 30, 36, .08), rgba(201, 169, 110, .08));
            filter: blur(40px);
            z-index: -1;
        }

        .decoration-1 {
            top: 10%;
            right: -60px;
        }

        .decoration-2 {
            bottom: 20%;
            left: -60px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .hero-container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .hero-content {
                max-width: 100%;
            }

            .hero-image {
                justify-content: center;
            }

            .image-card {
                max-width: 100%;
            }

            .floating-badge {
                left: 1rem;
                bottom: 1rem;
            }
        }

        @media (max-width: 640px) {
            .hero {
                padding: 2rem 1.5rem;
            }

            .hero-headline {
                font-size: 2.25rem;
            }

            .hero-description {
                font-size: 1rem;
            }

            .hero-cta {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-container">
            <!-- Left Content -->
            <div class="hero-content">
                <div class="hero-badge">
                    New: SushiCo Club Rewards
                </div>

                <h1 class="hero-headline">
                    Fresh Sushi.<br>Fast Delivery.
                </h1>

                <p class="hero-description">
                    Order your favorite sushi and earn rewards with SushiCo Club. Premium ingredients, authentic
                    flavors, delivered to your door.
                </p>

                <div class="hero-cta">
                    <a href="#order" class="btn btn-primary">
                        Order Now
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </a>
                    <a href="#club" class="btn btn-secondary">
                        Explore SushiCo Club
                    </a>
                </div>
            </div>

            <!-- Right Image -->
            <div class="hero-image">
                <div class="hero-decoration decoration-1"></div>
                <div class="hero-decoration decoration-2"></div>

                <div class="image-card">
                    <img src="https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=800&h=1000&fit=crop&q=90"
                        alt="Fresh Sushi Platter">

                    <!-- Floating Badge -->
                    <div class="floating-badge">
                        <div class="floating-badge-title">Delivery Time</div>
                        <div class="floating-badge-value">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <polyline points="12 6 12 12 16 14" />
                            </svg>
                            30 min
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
