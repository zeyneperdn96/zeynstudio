<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DESIGNER QUEST — Level Up Your Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e17;
    font-family:'Press Start 2P', monospace; -webkit-tap-highlight-color:transparent; }
  #dq-wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #14203a 0%, #070b14 100%); }
  #dq-stage { position:relative; }
  canvas#dq { display:block; image-rendering:auto;
    box-shadow:0 0 0 4px #1a2a4e, 0 0 40px rgba(0,0,0,.6); background:#7ec0ff; }

  /* ---- Overlay screens ---- */
  .dq-screen { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff;
    image-rendering:auto; }
  .dq-hidden { display:none !important; }

  /* Pixel dialog window (XP / Mario style) */
  .dq-win { background:#f4ecd0; border:4px solid #2a1a3a;
    box-shadow: inset 0 0 0 3px #c9b98a, 6px 6px 0 rgba(0,0,0,.35);
    padding:0; width:min(360px, 78%); color:#2a1a3a; }
  .dq-win-bar { background:linear-gradient(#3a2150,#2a1538); color:#ffd23f;
    font-size:11px; padding:9px 12px; display:flex; justify-content:space-between;
    align-items:center; letter-spacing:1px; }
  .dq-win-x { width:16px; height:16px; background:#c93b5c; color:#fff; font-size:9px;
    display:flex; align-items:center; justify-content:center; border:2px solid #2a1a3a; }
  .dq-win-body { padding:18px 18px 20px; }
  .dq-check { text-align:left; font-size:9px; line-height:2.4; color:#3a2a1a; margin-bottom:14px; }
  .dq-check span { color:#e0a32a; }

  .dq-btn { font-family:'Press Start 2P', monospace; cursor:pointer; border:none;
    background:linear-gradient(#ffd84a,#f0a81e); color:#5a2a00;
    box-shadow: inset 0 0 0 3px #fff4c0, 0 4px 0 #a8650e, 0 6px 8px rgba(0,0,0,.3);
    padding:14px 26px; font-size:13px; letter-spacing:2px; transition:transform .07s, box-shadow .07s; }
  .dq-btn:active { transform:translateY(3px); box-shadow: inset 0 0 0 3px #fff4c0, 0 1px 0 #a8650e; }
  .dq-btn.alt { background:linear-gradient(#7fe0ff,#1ea8e0); color:#073049;
    box-shadow: inset 0 0 0 3px #ddf6ff, 0 4px 0 #0e6f9a, 0 6px 8px rgba(0,0,0,.3); }

  .dq-title-img { font-size:46px; line-height:1.05; font-weight:400; letter-spacing:2px;
    color:#ffd23f; text-shadow:
      -3px -3px 0 #b8341f, 3px -3px 0 #b8341f, -3px 3px 0 #b8341f, 3px 3px 0 #b8341f,
      0 7px 0 #6a1810, 0 9px 0 #6a1810; margin-bottom:6px; }
  .dq-title-img .q { color:#ff5e8a; text-shadow:
      -3px -3px 0 #7a1538, 3px -3px 0 #7a1538, -3px 3px 0 #7a1538, 3px 3px 0 #7a1538,
      0 7px 0 #4a0c22, 0 9px 0 #4a0c22; }
  .dq-banner { background:#f4ecd0; color:#3a2a1a; border:3px solid #2a1a3a; font-size:9px;
    padding:7px 14px; margin:5px 0; letter-spacing:1px; box-shadow:3px 3px 0 rgba(0,0,0,.3); }

  .dq-big { font-size:30px; letter-spacing:2px; margin-bottom:8px; }
  .dq-sub { font-size:10px; line-height:2; margin-bottom:18px; color:#ffe; }
  .dq-stats { font-size:10px; line-height:2.4; color:#ffd23f; margin:10px 0 18px; }
  .dq-win-glow { color:#7fffb0; text-shadow:0 0 12px #2bff8a; }
  .dq-over-glow { color:#ff6e8a; text-shadow:0 0 12px #ff2e6e; }

  .dq-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .dq-scrim { position:absolute; inset:0; background:rgba(6,10,20,.72); }
  .dq-scrim.soft { background:rgba(6,10,20,.45); }

  /* Touch controls */
  #dq-touch { position:absolute; inset:0; pointer-events:none; display:none; }
  #dq-touch.show { display:block; }
  .dq-pad { position:absolute; bottom:18px; pointer-events:auto;
    width:64px; height:64px; border-radius:14px; background:rgba(244,236,208,.18);
    border:3px solid rgba(255,255,255,.5); color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center; user-select:none; }
  .dq-pad:active { background:rgba(255,210,63,.4); }
  #dq-left { left:18px; } #dq-right { left:96px; } #dq-jump { right:18px; width:84px; height:84px; }

  .dq-hint { position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:7px; color:rgba(255,255,255,.55); letter-spacing:1px; }
  .dq-credit { font-size:7px; color:rgba(255,255,255,.45); margin-top:16px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="dq-wrap">
  <div id="dq-stage">
    <canvas id="dq" width="960" height="540"></canvas>

    <!-- TITLE -->
    <div class="dq-screen" id="scr-title">
      <div class="dq-scrim soft"></div>
      <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%;">
        <div class="dq-title-img">DESIGNER<br><span class="q">QUEST</span></div>
        <div class="dq-banner">LEVEL UP YOUR PORTFOLIO</div>
        <div class="dq-banner">COLLECT YOUR SKILLS</div>
        <div class="dq-win" style="margin-top:16px;">
          <div class="dq-win-bar"><span>READY?</span><span class="dq-win-x">X</span></div>
          <div class="dq-win-body">
            <div class="dq-check">
              <span>★</span> BUILD YOUR PORTFOLIO<br>
              <span>★</span> COLLECT 5 SKILLS<br>
              <span>★</span> REACH PROJECT UNLOCKED
            </div>
            <button class="dq-btn" id="btn-start">START</button>
          </div>
        </div>
        <div class="dq-credit">A ZEYN STUDIO MINI-GAME · ◄ ► MOVE · SPACE JUMP</div>
      </div>
    </div>

    <!-- WIN -->
    <div class="dq-screen dq-hidden" id="scr-win">
      <div class="dq-scrim"></div>
      <div style="position:relative; z-index:2;">
        <div class="dq-big dq-win-glow">PROJECT<br>UNLOCKED!</div>
        <div class="dq-stats" id="win-stats"></div>
        <div class="dq-row">
          <button class="dq-btn" id="btn-replay">PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER -->
    <div class="dq-screen dq-hidden" id="scr-over">
      <div class="dq-scrim"></div>
      <div style="position:relative; z-index:2;">
        <div class="dq-big dq-over-glow">GAME OVER</div>
        <div class="dq-sub" id="over-stats"></div>
        <button class="dq-btn alt" id="btn-retry">RETRY</button>
      </div>
    </div>

    <!-- PAUSE -->
    <div class="dq-screen dq-hidden" id="scr-pause">
      <div class="dq-scrim soft"></div>
      <div style="position:relative; z-index:2;">
        <div class="dq-big">PAUSED</div>
        <button class="dq-btn alt" id="btn-resume">RESUME</button>
      </div>
    </div>

    <!-- LOADING -->
    <div class="dq-screen" id="scr-load">
      <div class="dq-scrim"></div>
      <div style="position:relative; z-index:2;" class="dq-sub" id="load-txt">LOADING… 0%</div>
    </div>

    <!-- Touch -->
    <div id="dq-touch">
      <div class="dq-pad" id="dq-left">◄</div>
      <div class="dq-pad" id="dq-right">►</div>
      <div class="dq-pad" id="dq-jump">▲</div>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  const VW = 960, VH = 540;
  const canvas = document.getElementById('dq');
  const ctx = canvas.getContext('2d');
  const RS = 2;                       // backing scale -> crisp output, less harsh pixelation
  canvas.width = VW*RS; canvas.height = VH*RS;
  ctx.imageSmoothingEnabled = false;
  let clock = 0;                      // global animation time (Date.now is unavailable here)

  // ---------- Asset loading ----------
  const BASE = 'assets/games/designer-quest/';
  const SRC = {
    idle:'sprites/idle.png', walk1:'sprites/walk1.png', walk2:'sprites/walk2.png', jump:'sprites/jump.png',
    enemy:'sprites/enemy.png',
    groundStart:'tiles/ground-start.png', groundMid:'tiles/ground-mid.png', groundStrip:'tiles/ground-strip.png',
    floatSm:'tiles/float-sm.png', floatLg:'tiles/float-lg.png',
    pipeShort:'tiles/pipe-short.png', pipeTall:'tiles/pipe-tall.png',
    coin:'tiles/coin.png', gift:'tiles/gift.png', sign:'tiles/sign.png',
    platPs:'tiles/plat-ps.png', platAi:'tiles/plat-ai.png', platFigma:'tiles/plat-figma.png',
    platBlender:'tiles/plat-blender.png', platRhino:'tiles/plat-rhino.png',
    trophy:'tiles/trophy.png', goal:'tiles/goal.png', flagTower:'tiles/flag-tower.png',
    icPs:'icons/photoshop.png', icAi:'icons/illustrator.png', icFigma:'icons/figma.png',
    icBlender:'icons/blender.png', icRhino:'icons/rhino.png'
  };
  const IMG = {};
  const keys = Object.keys(SRC);
  let loaded = 0;
  const loadTxt = document.getElementById('load-txt');

  function trim(img){
    // These sprites have NO alpha channel — opaque near-white background.
    // 1) flood-fill the background from the borders -> transparent (keeps interior whites: eyes, etc.)
    // 2) eat the light anti-aliased halo  3) crop to the character bbox.
    const c = document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const x = c.getContext('2d'); x.drawImage(img,0,0);
    let id;
    try { id = x.getImageData(0,0,c.width,c.height); }
    catch(e){ return img; } // tainted -> use raw
    const d=id.data, W=c.width, H=c.height;
    const bg = (i)=>{ const r=d[i],g=d[i+1],b=d[i+2]; const mn=Math.min(r,g,b), mx=Math.max(r,g,b); return mn>222 && (mx-mn)<26; };
    const seen = new Uint8Array(W*H);
    const stack = [];
    for(let xx=0;xx<W;xx++){ stack.push(xx); stack.push(xx+(H-1)*W); }
    for(let yy=0;yy<H;yy++){ stack.push(yy*W); stack.push(W-1+yy*W); }
    while(stack.length){
      const p=stack.pop(); if(seen[p]) continue; seen[p]=1;
      const i=p*4; if(!bg(i)) continue;
      d[i+3]=0;
      const px=p%W, py=(p/W)|0;
      if(px>0)stack.push(p-1); if(px<W-1)stack.push(p+1);
      if(py>0)stack.push(p-W); if(py<H-1)stack.push(p+W);
    }
    // halo: light pixels touching transparent -> transparent (2 passes)
    for(let pass=0; pass<2; pass++){
      const rm=[];
      for(let p=0;p<W*H;p++){ const i=p*4; if(d[i+3]===0) continue;
        const r=d[i],g=d[i+1],b=d[i+2], mn=Math.min(r,g,b), mx=Math.max(r,g,b);
        if(mn>200 && (mx-mn)<42){ const px=p%W, py=(p/W)|0;
          if((px>0&&d[(p-1)*4+3]===0)||(px<W-1&&d[(p+1)*4+3]===0)||(py>0&&d[(p-W)*4+3]===0)||(py<H-1&&d[(p+W)*4+3]===0)) rm.push(p);
        }
      }
      for(const p of rm) d[p*4+3]=0;
    }
    x.putImageData(id,0,0);
    // crop to opaque bbox
    let minX=W, minY=H, maxX=0, maxY=0, found=false;
    for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ if(d[(y*W+xx)*4+3]>24){ found=true;
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
    if(!found) return img;
    const w=maxX-minX+1, h=maxY-minY+1;
    const out=document.createElement('canvas'); out.width=w; out.height=h;
    out.getContext('2d').drawImage(c, minX,minY,w,h, 0,0,w,h);
    return out;
  }

  // High-quality stepped downscale (halving) so the big source sprite (1254px)
  // becomes a crisp, clean game sprite instead of a crushed nearest-neighbour mess.
  function downscale(src, targetH){
    const ratio=targetH/src.height;
    const tw=Math.max(1,Math.round(src.width*ratio)), th=Math.max(1,Math.round(src.height*ratio));
    let c=src, w=src.width, h=src.height;
    while(h > th*2){
      const nw=Math.max(tw,Math.round(w/2)), nh=Math.max(th,Math.round(h/2));
      const t=document.createElement('canvas'); t.width=nw; t.height=nh;
      const tx=t.getContext('2d'); tx.imageSmoothingEnabled=true; tx.imageSmoothingQuality='high';
      tx.drawImage(c,0,0,nw,nh); c=t; w=nw; h=nh;
    }
    const out=document.createElement('canvas'); out.width=tw; out.height=th;
    const ox=out.getContext('2d'); ox.imageSmoothingEnabled=true; ox.imageSmoothingQuality='high';
    ox.drawImage(c,0,0,tw,th);
    return out;
  }

  // Crop to the alpha bounding box (for assets that already have real transparency).
  function cropAlpha(img){
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const x=c.getContext('2d'); x.drawImage(img,0,0);
    let id; try{ id=x.getImageData(0,0,c.width,c.height); }catch(e){ return img; }
    const d=id.data, W=c.width, H=c.height; let minX=W,minY=H,maxX=0,maxY=0,found=false;
    for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ if(d[(y*W+xx)*4+3]>16){ found=true;
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
    if(!found) return img;
    const w=maxX-minX+1, h=maxY-minY+1;
    const out=document.createElement('canvas'); out.width=w; out.height=h;
    out.getContext('2d').drawImage(c, minX,minY,w,h, 0,0,w,h); return out;
  }
  const CHARS={idle:1,walk1:1,walk2:1,jump:1};
  const ALPHA_ART={enemy:1,icPs:1,icAi:1,icFigma:1,icBlender:1,icRhino:1};

  function loadAll(cb){
    keys.forEach(k=>{
      const im = new Image();
      im.onload = ()=>{
        // character sprites: chroma-key the opaque box; alpha art (enemy/skill blocks): just crop.
        // both get a high-quality downscale into a clean game-sprite resolution.
        IMG[k] = CHARS[k] ? downscale(trim(im), 260)
               : ALPHA_ART[k] ? downscale(cropAlpha(im), 150)
               : im;
        loaded++;
        loadTxt.textContent = 'LOADING… ' + Math.round(loaded/keys.length*100) + '%';
        if(loaded===keys.length) cb();
      };
      im.onerror = ()=>{ IMG[k]=null; loaded++;
        loadTxt.textContent = 'LOADING… ' + Math.round(loaded/keys.length*100) + '%';
        if(loaded===keys.length) cb(); };
      im.src = BASE + SRC[k];
    });
  }

  // ---------- Tiny WebAudio SFX ----------
  let AC=null;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq, dur, type, vol){
    const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.value=vol||0.06; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.stop(t+dur);
  }
  const SFX = {
    jump(){ beep(520,0.12,'square',0.05); },
    coin(){ beep(880,0.07,'square',0.05); beep(1320,0.09,'square',0.04); },
    skill(){ beep(660,0.08,'triangle',0.06); beep(990,0.12,'triangle',0.05); beep(1320,0.14,'triangle',0.04); },
    stomp(){ beep(180,0.12,'square',0.06); },
    hurt(){ beep(160,0.22,'sawtooth',0.07); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.06),i*120)); },
    over(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.06),i*140)); }
  };

  // ---------- Input ----------
  const input = { left:false, right:false, jump:false, jumpPressed:false };
  const keymap = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
    Space:'jump', ArrowUp:'jump', KeyW:'jump'};
  addEventListener('keydown', e=>{
    if(keymap[e.code]){ e.preventDefault();
      if(keymap[e.code]==='jump' && !input.jump) input.jumpPressed=true;
      input[keymap[e.code]]=true; }
    if(e.code==='KeyP' || e.code==='Escape') togglePause();
    if(e.code==='Enter'){ if(state==='title') startGame(); else if(state==='win'||state==='over') startGame(); }
  });
  addEventListener('keyup', e=>{ if(keymap[e.code]){ e.preventDefault(); input[keymap[e.code]]=false; } });

  function bindPad(id, prop){
    const el=document.getElementById(id);
    const on=e=>{ e.preventDefault(); if(prop==='jump'&&!input.jump) input.jumpPressed=true; input[prop]=true; };
    const off=e=>{ e.preventDefault(); input[prop]=false; };
    el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off);
    el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
  }
  bindPad('dq-left','left'); bindPad('dq-right','right'); bindPad('dq-jump','jump');
  if('ontouchstart' in window) document.getElementById('dq-touch').classList.add('show');

  // ---------- World / Level ----------
  const GROUND_TOP = 452;
  const WORLD_H = VH;
  let WORLD_W = 5200;

  // ground spans (solid), gaps between = pits
  const GROUND = [
    {x:0, w:1500}, {x:1620, w:1080}, {x:2820, w:1080}, {x:4020, w:1300}
  ];

  // solid blocks (full collision): pipes
  // one-way platforms: floating + skill platforms (land from above)
  function buildLevel(){
    const solids=[];   // {x,y,w,h, img, dw, dh}  full solid
    const oneway=[];   // {x,y,w, top, img, dw, dh}
    const coins=[];    // {x,y, got:false, t}
    const skills=[];   // {x,y, key, icon, name, got:false}
    const enemies=[];  // {x,y,w,h, x0,x1, dir, dead, t}
    const spikes=[];   // {x,y,w,h}
    const deco=[];     // {img,x,y,dw,dh} purely visual behind

    const gifts=[];    // {x,y,w,h,got,t} early reward pickups
    const signX = 40;  // wooden start sign drawn procedurally (no asset)

    // --- helpers ---
    function pipe(x, ph){ // green pipe, full solid step/obstacle
      const imgKey = ph>=180 ? 'pipeTall' : 'pipeShort';
      const img=IMG[imgKey]; const ar=img? img.width/img.height : 0.64; const pw=ph*ar;
      solids.push({x, y:GROUND_TOP-ph, w:pw, h:ph, img:imgKey, dw:pw, dh:ph});
      return {x, w:pw, top:GROUND_TOP-ph};
    }
    function step(imgKey, x, y){ // grass-brick floating step (one-way, land from above)
      const img=IMG[imgKey]; const dw=img?img.width:144, dh=img?img.height:72;
      oneway.push({x, y, w:dw, top:y+10, img:imgKey, dw, dh});
      return {x, y, w:dw, top:y+10};
    }
    function skill(key, icon, name, x, y){ // single system: tool icon resting on a grass step
      const pl = step('floatSm', x, y);
      skills.push({x:pl.x+pl.w/2, y:pl.top-24, key, icon, name, got:false, t:Math.random()*6.28});
      return pl;
    }
    function coinLine(x,y,n,gap){ for(let i=0;i<n;i++) coins.push({x:x+i*gap, y, got:false, t:Math.random()*6.28}); }
    function coinArc(cx,y,n,gap,h){ const half=(n-1)/2; for(let i=0;i<n;i++){ const t=i-half;
      coins.push({x:cx+t*gap, y:y-Math.round(h*(1-(t*t)/((half*half)||1))), got:false, t:Math.random()*6.28}); } }

    // ===== ZONE 1 — START (clean flat hero zone) =====
    //  sign(40) → spawn(210) → guide coins → GIFT reward(470)
    coinLine(312, 372, 3, 46);                       // first coins teach "go right"
    gifts.push({x:470, y:GROUND_TOP-64, w:64, h:64, got:false, t:0});  // first reward, clear & important

    // ===== ZONE 2 — FIRST STEP (short, jumpable pipe) =====
    pipe(720, 84);                                   // short first step-up, easy to jump onto
    coinArc(782, 322, 4, 36, 46);                    // low arc up-and-over (guides the jump)
    step('floatSm', 956, 362);                       // gentle grass step after the pipe

    // ===== ZONE 3 — FIRST SKILL (clear small goal) =====
    skill('ps','icPs','PHOTOSHOP', 1150, 318);       // Photoshop = first skill goal (reachable)
    coinArc(1212, 250, 3, 36, 22);                   // float the coins clearly ABOVE the PS block
    addBug(1360, 1230, 1470);                        // first enemy only after the calm start

    // pit 1500–1620 — bridged by a step
    step('floatSm', 1510, 356); coinArc(1560, 318, 3, 38, 36);

    // ===== ZONE 4 =====
    skill('ai','icAi','ILLUSTRATOR', 1740, 322);
    pipe(2060, 100); coinArc(2120, 320, 4, 36, 44);  // short pipe + arc over
    skill('figma','icFigma','FIGMA', 2340, 318);
    addBug(2460, 2360, 2640);
    spikes.push({x:2560, y:GROUND_TOP-22, w:66, h:22});

    // pit 2700–2820 — bridged by a wider step
    step('floatLg', 2710, 318); coinArc(2770, 286, 3, 40, 40);

    // ===== ZONE 5 =====
    skill('blender','icBlender','BLENDER', 3000, 312);
    addBug(3300, 3180, 3460);
    pipe(3480, 84); coinArc(3540, 322, 4, 36, 46);
    skill('rhino','icRhino','RHINO', 3700, 318);
    spikes.push({x:3560, y:GROUND_TOP-22, w:52, h:22});

    // pit 3900–4020 — bridged
    step('floatSm', 3910, 320); coinArc(3960, 274, 3, 40, 46);

    // ===== ZONE 6 — GOAL =====
    coinLine(4180, 372, 4, 46);
    const tImg=IMG.trophy; const tdh=120, tdw=tImg? tImg.width/tImg.height*tdh : 114;
    deco.push({img:'trophy', x:4520, y:GROUND_TOP-tdh, dw:tdw, dh:tdh});
    const goalX=4760;                                  // procedural goal area -> drawGoal()
    const goalZone = {x:goalX+28, y:GROUND_TOP-170, w:196, h:170};

    function addBug(x,x0,x1){ enemies.push({x, y:GROUND_TOP-34, w:40, h:34, x0, x1, dir:1, dead:false, t:Math.random()*6.28, squashT:0}); }

    WORLD_W = 5340;
    return {solids, oneway, coins, skills, enemies, spikes, deco, gifts, goalZone, goalX, signX};
  }

  // ---------- Player ----------
  const PW=40, PH=58;
  let player, cam, level, state='title', stars=0, coinCount=0, startTime=0, elapsed=0, lives, shake=0, particles, vignette=0;
  const TOTAL_SKILLS = 5;
  const G = 2100, MOVE=2600, MAXV=270, FRICT=2000, JUMP=775, MAXFALL=760;

  function resetPlayer(){
    player = { x:210, y:GROUND_TOP-PH, vx:0, vy:0, w:PW, h:PH, face:1, grounded:false,
      coyote:0, buffer:0, anim:0, invuln:0, jumpHeld:false, alive:true };
  }
  function newGame(){
    level = buildLevel();
    resetPlayer();
    cam={x:0,y:0}; stars=0; coinCount=0; lives=3; elapsed=0; shake=0; particles=[]; vignette=0;
    startTime=performance.now();
  }

  function addParticles(x,y,color,n,spd){
    for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=spd*(0.4+Math.random());
      particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s-60, life:0.5+Math.random()*0.4, t:0, color, size:2+Math.random()*3}); }
  }

  function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  function hurt(){
    if(player.invuln>0) return;
    lives--; player.invuln=1.4; shake=12; SFX.hurt();
    player.vy=-360; player.vx = -player.face*200;
    addParticles(player.x+PW/2, player.y+PH/2, '#ff3b5c', 14, 240);
    if(lives<=0){ player.alive=false; gameOver(); }
  }
  function respawnFromPit(){
    if(player.invuln>0 && player.y>WORLD_H+200){} // still process
    lives--; shake=14; SFX.hurt();
    if(lives<=0){ player.alive=false; gameOver(); return; }
    // place back on nearest ground to the left
    let gx=120;
    for(const g of GROUND){ if(player.x>g.x) gx = g.x + 40; }
    player.x=Math.max(120, gx); player.y=GROUND_TOP-PH-20; player.vx=0; player.vy=0; player.invuln=1.4;
  }

  // ---------- Update ----------
  function update(dt){
    if(state!=='play') return;
    const p=player;

    // horizontal
    if(input.left && !input.right){ p.vx-=MOVE*dt; p.face=-1; }
    else if(input.right && !input.left){ p.vx+=MOVE*dt; p.face=1; }
    else { // friction
      if(p.vx>0){ p.vx-=FRICT*dt; if(p.vx<0)p.vx=0; }
      else if(p.vx<0){ p.vx+=FRICT*dt; if(p.vx>0)p.vx=0; }
    }
    p.vx=Math.max(-MAXV, Math.min(MAXV, p.vx));

    // jump (coyote + buffer)
    p.coyote = p.grounded ? 0.1 : Math.max(0, p.coyote-dt);
    if(input.jumpPressed){ p.buffer=0.12; input.jumpPressed=false; }
    p.buffer=Math.max(0, p.buffer-dt);
    if(p.buffer>0 && p.coyote>0){ p.vy=-JUMP; p.grounded=false; p.coyote=0; p.buffer=0; p.jumpHeld=true; SFX.jump();
      addParticles(p.x+PW/2, p.y+PH, '#fff', 6, 120); }
    if(!input.jump && p.vy<0 && p.jumpHeld){ p.vy*=0.55; p.jumpHeld=false; }
    if(p.vy>=0) p.jumpHeld=false;

    // gravity
    p.vy+=G*dt; if(p.vy>MAXFALL)p.vy=MAXFALL;

    // ---- move X + collide solids ----
    p.x+=p.vx*dt;
    for(const s of level.solids){
      if(rectsOverlap(p,s)){
        if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w;
        p.vx=0;
      }
    }
    if(p.x<0)p.x=0; if(p.x+p.w>WORLD_W)p.x=WORLD_W-p.w;

    // ---- move Y + collide ----
    p.y+=p.vy*dt;
    p.grounded=false;
    // ground spans
    for(const g of GROUND){
      const gb={x:g.x, y:GROUND_TOP, w:g.w, h:WORLD_H-GROUND_TOP+60};
      if(p.x+p.w>gb.x && p.x<gb.x+gb.w){
        if(p.vy>0 && p.y+p.h>GROUND_TOP && p.y+p.h-p.vy*dt<=GROUND_TOP+2){
          p.y=GROUND_TOP-p.h; p.vy=0; p.grounded=true;
        }
      }
    }
    // solids (pipes) top/bottom
    for(const s of level.solids){
      if(rectsOverlap(p,s)){
        if(p.vy>0){ p.y=s.y-p.h; p.vy=0; p.grounded=true; }
        else if(p.vy<0){ p.y=s.y+s.h; p.vy=0; }
      }
    }
    // one-way platforms (land from above only)
    for(const o of level.oneway){
      if(p.x+p.w>o.x+6 && p.x<o.x+o.w-6){
        if(p.vy>=0 && p.y+p.h>o.top && p.y+p.h-p.vy*dt<=o.top+2){
          p.y=o.top-p.h; p.vy=0; p.grounded=true;
        }
      }
    }

    // pit fall
    if(p.y>WORLD_H+120){ respawnFromPit(); }

    // invuln timer
    if(p.invuln>0) p.invuln-=dt;

    // ---- coins (collectible along the character's whole visual height -> grab while walking;
    //      taller arc coins still need a jump) ----
    for(const c of level.coins){
      if(c.got) continue; c.t+=dt*6;
      if(Math.abs((p.x+PW/2)-c.x)<34 && c.y > p.y-34 && c.y < p.y+PH+8){
        c.got=true; coinCount++; SFX.coin(); addParticles(c.x,c.y,'#ffd23f',7,160);
      }
    }
    // ---- skills ----
    for(const s of level.skills){
      if(s.got) continue; s.t+=dt*3;
      if(Math.abs((p.x+PW/2)-s.x)<40 && Math.abs((p.y+PH/2)-(s.y))<48){
        s.got=true; stars++; SFX.skill(); shake=6;
        addParticles(s.x,s.y,'#00e5ff',16,220); vignette=0; banner(s.name+' UNLOCKED!');
      }
    }
    // ---- gift reward ----
    for(const gf of level.gifts){ if(gf.got) continue; gf.t+=dt;
      if(rectsOverlap(p, gf)){ gf.got=true; coinCount+=5; SFX.skill(); shake=5;
        addParticles(gf.x+gf.w/2, gf.y+gf.h/2, '#ffd23f', 18, 200); banner('BONUS +5 COINS'); }
    }
    // ---- spikes ----
    for(const sp of level.spikes){ if(rectsOverlap(p,sp)) hurt(); }

    // ---- enemies ----
    for(const e of level.enemies){
      if(e.dead){ e.squashT-=dt; continue; }
      e.t+=dt; e.x += e.dir*60*dt;
      if(e.x<e.x0){ e.x=e.x0; e.dir=1; } if(e.x>e.x1){ e.x=e.x1; e.dir=-1; }
      const eb={x:e.x,y:e.y,w:e.w,h:e.h};
      if(rectsOverlap(p,eb)){
        const fromAbove = p.vy>0 && (p.y+p.h-p.vy*dt) <= e.y+8;
        if(fromAbove){ e.dead=true; e.squashT=0.4; p.vy=-440; SFX.stomp(); shake=6;
          addParticles(e.x+e.w/2, e.y, '#b06bff', 14, 200); }
        else hurt();
      }
    }

    // particles
    for(const pt of particles){ pt.t+=dt; pt.vy+=600*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; }
    particles=particles.filter(pt=>pt.t<pt.life);

    // low-HP vignette
    const targetVig = lives<=1 ? 0.55 : 0;
    vignette += (targetVig - vignette)*Math.min(1,dt*4);

    // shake decay
    if(shake>0) shake=Math.max(0, shake-dt*40);

    // anim
    if(Math.abs(p.vx)>20 && p.grounded) p.anim+=dt*Math.abs(p.vx)*0.02; else p.anim=0;

    // camera
    cam.x = Math.max(0, Math.min(WORLD_W-VW, p.x+PW/2 - VW*0.42));
    cam.y = 0;

    // goal
    if(rectsOverlap(p, level.goalZone)) win();

    elapsed = (performance.now()-startTime)/1000;
  }

  // banner (in-world toast)
  let bannerText='', bannerT=0;
  function banner(t){ bannerText=t; bannerT=2.2; }

  // ---------- Render ----------
  function drawImg(key, x, y, dw, dh){
    const im=IMG[key]; if(!im) return;
    ctx.drawImage(im, Math.round(x-cam.x), Math.round(y-cam.y), Math.round(dw), Math.round(dh));
  }

  function drawBackground(){
    // sky
    const g=ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#4a9bf0'); g.addColorStop(0.6,'#7ec0ff'); g.addColorStop(1,'#a9dcff');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
    // parallax city (two layers, simple silhouettes)
    cityLayer(0.2, '#3f6fa6', 150, 64, 70);
    cityLayer(0.4, '#33608f', 210, 80, 90);
    // clouds
    ctx.fillStyle='rgba(255,255,255,.85)';
    cloud(((-cam.x*0.15)%1100+1100)%1100 - 100, 70, 1);
    cloud(((-cam.x*0.15)%1100+1100)%1100 + 520, 120, 0.8);
    // water at very bottom
    ctx.fillStyle='#2a78c8'; ctx.fillRect(0,VH-14,VW,14);
  }
  function cloud(x,y,s){ ctx.beginPath();
    ctx.arc(x,y,22*s,0,7); ctx.arc(x+26*s,y+6*s,18*s,0,7); ctx.arc(x-24*s,y+8*s,16*s,0,7);
    ctx.rect(x-24*s,y,52*s,16*s); ctx.fill(); }
  function cityLayer(par, color, base, minH, maxH){
    ctx.fillStyle=color;
    const off = (cam.x*par)%80;
    for(let i=-1;i<VW/80+2;i++){
      const seed=Math.floor((cam.x*par)/80)+i;
      const h = minH + ((Math.sin(seed*12.9898)*43758.5)%1+1)%1 * (maxH-minH);
      const x = i*80 - off;
      ctx.fillRect(x, GROUND_TOP-base-h+base, 60, h+base);
    }
  }

  function drawGround(){
    const strip=IMG.groundStrip; if(!strip) return;
    const sh = WORLD_H-GROUND_TOP; const sw = strip.width/strip.height*sh;
    for(const g of GROUND){
      let x=g.x; const end=g.x+g.w;
      while(x<end){
        const w=Math.min(sw, end-x);
        ctx.drawImage(strip, 0,0, Math.round(w/sw*strip.width), strip.height,
          Math.round(x-cam.x), Math.round(GROUND_TOP-cam.y), Math.round(w), Math.round(sh));
        x+=sw;
      }
    }
  }

  function drawPlayer(){
    const p=player;
    let key='idle';
    if(!p.grounded) key='jump';
    else if(Math.abs(p.vx)>20) key = (Math.floor(p.anim)%2===0)?'walk1':'walk2';
    const im=IMG[key]; if(!im){ ctx.fillStyle='#ff2e97'; ctx.fillRect(p.x-cam.x,p.y-cam.y,PW,PH); return; }
    const dh = 90; const dw = im.width/im.height*dh;        // visual is taller than the hitbox -> readable face
    const dx = p.x+PW/2 - dw/2 - cam.x;
    const dy = p.y+PH - dh + 4 - cam.y;
    if(p.invuln>0 && Math.floor(p.invuln*16)%2===0) return; // blink
    ctx.save(); ctx.imageSmoothingEnabled=true;             // smooth -> clean, not crushed
    if(p.face<0){ ctx.translate(Math.round(dx+dw),0); ctx.scale(-1,1); ctx.drawImage(im, 0, Math.round(dy), Math.round(dw), Math.round(dh)); }
    else ctx.drawImage(im, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));
    ctx.restore();
  }

  function drawCoin(c){
    const im=IMG.coin; const s=30+Math.sin(c.t)*0; const sq=Math.abs(Math.cos(c.t)); // spin
    const w=Math.max(6, 30*sq+6), h=34;
    if(im) ctx.drawImage(im, Math.round(c.x-w/2-cam.x), Math.round(c.y-h/2-cam.y), Math.round(w), Math.round(h));
  }

  function drawEnemy(e){
    const im=IMG.enemy;
    const VDH=50;                                   // visual height (a touch bigger than the 34px hitbox)
    const dw = im ? im.width/im.height*VDH : e.w;
    const cx = e.x + e.w/2;
    if(e.dead){ // squash + fade
      const k=Math.max(0,e.squashT/0.4);
      ctx.save(); ctx.globalAlpha=k; ctx.imageSmoothingEnabled=true;
      const sh=VDH*0.45*(0.6+0.4*k), sw=dw*(1.15);
      if(im) ctx.drawImage(im, Math.round(cx-sw/2-cam.x), Math.round(e.y+e.h-sh-cam.y), Math.round(sw), Math.round(sh));
      ctx.restore(); return;
    }
    const bob=Math.round(Math.sin(e.t*6)*2);
    const dx=cx-dw/2-cam.x, dy=e.y+e.h-VDH-cam.y+bob;
    ctx.save(); ctx.imageSmoothingEnabled=true;
    if(im){
      if(e.dir<0){ ctx.translate(Math.round(dx+dw),0); ctx.scale(-1,1); ctx.drawImage(im, 0, Math.round(dy), Math.round(dw), Math.round(VDH)); }
      else ctx.drawImage(im, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(VDH));
    } else { // fallback
      ctx.fillStyle='#3a2150'; ctx.fillRect(Math.round(e.x-cam.x),Math.round(e.y+bob-cam.y),e.w,e.h);
    }
    ctx.restore();
  }

  function drawSpike(sp){
    const x=Math.round(sp.x-cam.x), y=Math.round(sp.y-cam.y);
    const n=Math.floor(sp.w/16);
    for(let i=0;i<n;i++){
      ctx.fillStyle='#c9ccd4'; ctx.beginPath();
      ctx.moveTo(x+i*16,y+sp.h); ctx.lineTo(x+i*16+8,y); ctx.lineTo(x+i*16+16,y+sp.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#8a8f9c'; ctx.fillRect(x+i*16, y+sp.h-3, 16, 3);
    }
  }

  function drawSign(wx){
    const sx=Math.round(wx-cam.x); if(sx>VW+40 || sx<-220) return;
    const top=GROUND_TOP-150, PW2=156;
    // post
    ctx.fillStyle='#3f2814'; ctx.fillRect(sx+68, top+6, 18, 152);
    ctx.fillStyle='#5a3a1e'; ctx.fillRect(sx+71, top+6, 9, 152);
    const planks=['DESIGN','CREATE','PLAY'];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<3;i++){ const py=top+i*48;
      ctx.fillStyle='#231307'; ctx.fillRect(sx-3, py-3, PW2+6, 42);          // outline
      const g=ctx.createLinearGradient(0,py,0,py+36); g.addColorStop(0,'#9c5f30'); g.addColorStop(1,'#774524');
      ctx.fillStyle=g; ctx.fillRect(sx, py, PW2, 36);
      ctx.fillStyle='rgba(255,224,180,.18)'; ctx.fillRect(sx, py+3, PW2, 3);
      ctx.fillStyle='rgba(0,0,0,.20)'; ctx.fillRect(sx, py+30, PW2, 3);
      ctx.font="13px 'Press Start 2P', monospace";
      ctx.fillStyle='#3a2410'; ctx.fillText(planks[i], sx+PW2/2+1, py+19);
      ctx.fillStyle='#ffe9c0'; ctx.fillText(planks[i], sx+PW2/2, py+18);
    }
    ctx.textAlign='left'; ctx.textBaseline='top';
  }

  // Procedural goal/unlock area: cohesive brick gate (PROJECT UNLOCKED door + lock)
  // + taller ladder tower with flag + clean bushes & mushroom. Pixel-art, thin outlines.
  function drawGoal(wx){
    const gY=GROUND_TOP, sx=wx-cam.x;
    if(sx>VW+90 || sx<-380) return;
    const X=v=>Math.round(sx+v), Y=h=>Math.round(gY-h);
    const OUT='#241208', BR='#9c5a2e', BR2='#854a25', MOR='#5e3318', BRT='#b06d38';
    const GRO='#244d14', GRD='#3f7d22', GR='#6fbf3a', GRL='#8fd957';
    const PUR='#7a3bd8', PURD='#5526a0', PURL='#9d6bf0', POUT='#23103f';

    function bricks(lx, lw, h){
      const x=X(lx), y=Y(h), W=Math.round(lw), H=Math.round(h);
      ctx.fillStyle=OUT; ctx.fillRect(x-3,y-3,W+6,H+6);
      ctx.fillStyle=BR;  ctx.fillRect(x,y,W,H);
      ctx.fillStyle=MOR;
      for(let ry=0; ry<H; ry+=20) ctx.fillRect(x, y+ry, W, 2);
      for(let r=0; r*20<H; r++){ const ry=r*20, off=(r%2)?0:22;
        for(let rx=off; rx<W; rx+=44) ctx.fillRect(x+rx, y+ry, 2, Math.min(20,H-ry)); }
      ctx.fillStyle=BR2; ctx.fillRect(x, y+H-6, W, 6);
      ctx.fillStyle=BRT; ctx.fillRect(x, y, 4, H);
    }
    function grass(lx, lw, topH){
      const x=X(lx), y=Y(topH), W=Math.round(lw);
      ctx.fillStyle=OUT; ctx.fillRect(x-3, y-3, W+6, 25);
      ctx.fillStyle=GRD; ctx.fillRect(x, y, W, 21);
      ctx.fillStyle=GR;  ctx.fillRect(x, y, W, 11);
      ctx.fillStyle=GRL; ctx.fillRect(x, y, W, 4);
    }
    function bush(lx, r){ const x=X(lx), y=Y(r*0.55);
      ctx.fillStyle=GRO; ctx.beginPath(); ctx.arc(x,y,r+2,0,7); ctx.fill();
      ctx.fillStyle=GRD; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      ctx.fillStyle=GR;  ctx.beginPath(); ctx.arc(x-r*0.3, y-r*0.35, r*0.5, 0,7); ctx.fill(); }

    bush(2,14); bush(20,18); bush(40,12);

    // ===== TOWER =====
    const tX=210, tW=128, tH=224;
    bricks(tX, tW, tH);
    grass(tX-6, tW+12, tH+20);
    const lX=tX+36, lW=56;
    ctx.fillStyle=BR2; ctx.fillRect(X(lX-5), Y(tH-12), lW+10, Math.round(tH-30));   // recessed channel
    ctx.fillStyle='#caa23a';
    ctx.fillRect(X(lX), Y(tH-12), 7, Math.round(tH-34));
    ctx.fillRect(X(lX+lW-7), Y(tH-12), 7, Math.round(tH-34));
    for(let rh=tH-22; rh>18; rh-=24){ ctx.fillStyle='#e0bd4a'; ctx.fillRect(X(lX), Y(rh), lW, 7);
      ctx.fillStyle='#9c7a20'; ctx.fillRect(X(lX), Y(rh)+5, lW, 2); }
    // flag
    const poleX=tX+tW-34, poleH=tH+20+70, fbaseH=tH+20;
    ctx.fillStyle='#6a4a1e'; ctx.fillRect(X(poleX), Y(poleH), 6, Math.round(poleH-fbaseH));
    ctx.fillStyle='#caa23a'; ctx.fillRect(X(poleX)-1, Y(poleH)-3, 8, 5);
    const wave=Math.round(Math.sin(clock*3)*3);
    ctx.fillStyle=POUT;
    ctx.beginPath(); ctx.moveTo(X(poleX+6), Y(poleH)); ctx.lineTo(X(poleX+6+58), Y(poleH-16)+wave); ctx.lineTo(X(poleX+6), Y(poleH-34)); ctx.closePath(); ctx.fill();
    ctx.fillStyle=PUR;
    ctx.beginPath(); ctx.moveTo(X(poleX+6), Y(poleH)+2); ctx.lineTo(X(poleX+6+50), Y(poleH-16)+wave); ctx.lineTo(X(poleX+6), Y(poleH-31)); ctx.closePath(); ctx.fill();

    // ===== GATE (lower) =====
    const gX=24, gW=178, gH=150;
    bricks(gX, gW, gH);
    grass(gX-4, gW+8, gH+18);

    // mushroom (right of tower base)
    (function(){ const mx=tX+tW+16, x=X(mx), y=Y(0);
      ctx.fillStyle=OUT; ctx.fillRect(x-2, y-30, 18, 30);
      ctx.fillStyle='#e8d9b0'; ctx.fillRect(x, y-28, 14, 28);
      ctx.fillStyle=OUT; ctx.fillRect(x-9, y-46, 32, 20);
      ctx.fillStyle='#e0463c'; ctx.fillRect(x-7, y-44, 28, 17);
      ctx.fillStyle='#ff6a5c'; ctx.fillRect(x-7, y-44, 28, 5);
      ctx.fillStyle='#fff'; ctx.fillRect(x-2, y-39, 5,5); ctx.fillRect(x+10, y-36, 4,4); })();

    // ===== DOOR (PROJECT UNLOCKED) =====
    const dW=126, dX=gX+(gW-dW)/2, dBaseH=10, dBodyTopH=118;
    const dx0=X(dX), dw=Math.round(dW), cx=dx0+dw/2;
    const yBodyTop=Y(dBodyTopH), yBase=Y(dBaseH);
    ctx.save(); ctx.globalAlpha=0.22+Math.sin(clock*3)*0.10; ctx.fillStyle='#b98bff';
    ctx.fillRect(dx0-12, yBodyTop-46, dw+24, (yBase-yBodyTop)+60); ctx.restore();
    ctx.fillStyle=POUT; ctx.fillRect(dx0-3, yBodyTop, dw+6, yBase-yBodyTop);
    ctx.fillStyle=PUR;  ctx.fillRect(dx0, yBodyTop, dw, yBase-yBodyTop);
    ctx.fillStyle=PURD; ctx.fillRect(dx0, yBase-6, dw, 6);
    ctx.fillStyle=PURL; ctx.fillRect(dx0, yBodyTop, 5, yBase-yBodyTop);
    // arched top (stepped, thin outline) — no thick black arch
    let by=yBodyTop; const bands=[dw, dw-16, dw-38, dw-68, dw-106];
    for(let i=0;i<bands.length;i++){ const ww=Math.max(12, bands[i]); const bx=Math.round(cx-ww/2);
      ctx.fillStyle=POUT; ctx.fillRect(bx-3, by-9, Math.round(ww)+6, 10);
      ctx.fillStyle=PUR;  ctx.fillRect(bx, by-9, Math.round(ww), 9);
      ctx.fillStyle=PURL; ctx.fillRect(bx, by-9, Math.round(ww), 2);
      by-=9; }
    // centered text
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const tcy=(yBodyTop+yBase)/2 - 6;
    ctx.font="12px 'Press Start 2P', monospace";
    ctx.fillStyle=POUT; ctx.fillText('PROJECT', cx+1, tcy-11+1);
    ctx.fillStyle='#f1e8ff'; ctx.fillText('PROJECT', cx, tcy-11);
    ctx.fillStyle=POUT; ctx.fillText('UNLOCKED', cx+1, tcy+9+1);
    ctx.fillStyle='#f1e8ff'; ctx.fillText('UNLOCKED', cx, tcy+9);
    ctx.textAlign='left'; ctx.textBaseline='top';
    // polished padlock
    (function(){ const lw=28, lh=22, lx=Math.round(cx-lw/2), ly=yBase-lh-8;
      ctx.fillStyle='#aeb7c6'; ctx.fillRect(lx+5, ly-12, 4, 13); ctx.fillRect(lx+lw-9, ly-12, 4, 13); ctx.fillRect(lx+5, ly-14, lw-10, 5);
      ctx.fillStyle='#d7deea'; ctx.fillRect(lx+6, ly-13, 2, 11);
      ctx.fillStyle=OUT; ctx.fillRect(lx-2, ly-2, lw+4, lh+4);
      ctx.fillStyle='#f0a81e'; ctx.fillRect(lx, ly, lw, lh);
      ctx.fillStyle='#ffd84a'; ctx.fillRect(lx, ly, lw, 6);
      ctx.fillStyle='#a8650e'; ctx.fillRect(lx, ly+lh-4, lw, 4);
      ctx.fillStyle='#7a4a08'; ctx.fillRect(Math.round(cx-3), ly+7, 6, 6); ctx.fillRect(Math.round(cx-2), ly+11, 4, 7); })();
    // gate sparkles (rewarding)
    if(Math.floor(clock*3)%2===0){ ctx.fillStyle='#fff';
      ctx.fillRect(dx0-9, Y(dBodyTopH+8), 3,3); ctx.fillRect(dx0+dw+6, Y(dBodyTopH-8), 3,3); }
  }

  function drawGift(gf){
    if(gf.got) return;
    const im=IMG.gift; const bob=Math.round(Math.sin(gf.t*3)*2);
    const x=Math.round(gf.x-cam.x), y=Math.round(gf.y-cam.y+bob);
    // importance glow
    ctx.save(); ctx.globalAlpha=0.35+Math.sin(gf.t*4)*0.15;
    ctx.fillStyle='rgba(255,210,63,.5)'; ctx.beginPath(); ctx.arc(x+gf.w/2,y+gf.h/2,gf.w*0.8,0,7); ctx.fill();
    ctx.restore();
    if(im) ctx.drawImage(im, x, y, gf.w, gf.h);
    // sparkles
    if(Math.floor(gf.t*5)%2===0){ ctx.fillStyle='#fff';
      ctx.fillRect(x-5,y+6,3,3); ctx.fillRect(x+gf.w+2,y+14,3,3); ctx.fillRect(x+gf.w/2,y-6,3,3); }
  }

  function drawSkill(s){
    if(s.got) return;
    const im=IMG[s.icon]; const bob=Math.round(Math.sin(s.t)*5);
    const dh=54, dw= im ? im.width/im.height*dh : 48;
    const x=Math.round(s.x-dw/2-cam.x), y=Math.round(s.y-dh/2-cam.y+bob);
    // soft ground shadow (subtle, NOT a halo)
    ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(Math.round(s.x-cam.x), Math.round(s.y+dh/2+6-cam.y), dw*0.36, 5, 0, 0, 7); ctx.fill();
    ctx.restore();
    // the collectible block (clean, sharp)
    ctx.save(); ctx.imageSmoothingEnabled=true;
    if(im) ctx.drawImage(im, x, y, Math.round(dw), Math.round(dh));
    else { ctx.fillStyle='#9aa6b8'; ctx.fillRect(x,y,48,48); }
    ctx.restore();
    // clean sparkle accents (no ring)
    if(Math.floor(s.t*3)%4===0){ ctx.fillStyle='#fff';
      ctx.fillRect(x+Math.round(dw)+2, y+8, 3,3); ctx.fillRect(x-5, y+Math.round(dh)-14, 3,3); }
  }

  function drawParticles(){
    for(const pt of particles){ ctx.globalAlpha=Math.max(0,1-pt.t/pt.life);
      ctx.fillStyle=pt.color; ctx.fillRect(Math.round(pt.x-cam.x),Math.round(pt.y-cam.y),pt.size,pt.size); }
    ctx.globalAlpha=1;
  }

  // ---------- HUD ----------
  function drawHUD(){
    ctx.save();
    // hearts
    for(let i=0;i<3;i++){ heart(16+i*26, 16, i<lives); }
    // stars (skills)
    for(let i=0;i<TOTAL_SKILLS;i++){ star(16+i*22, 46, i<stars); }
    // coin counter (top-right)
    const im=IMG.coin; if(im) ctx.drawImage(im, VW-118, 12, 26, 30);
    pixText(String(coinCount).padStart(4,'0'), VW-86, 22, 12, '#fff', '#2a1a3a');
    // XP bar (skills progress)
    const bx=VW-220, by=16, bw=92, bh=14;
    ctx.fillStyle='#1a2a4e'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    ctx.fillStyle='#0a1430'; ctx.fillRect(bx,by,bw,bh);
    const fillW=Math.round(bw*(stars/TOTAL_SKILLS));
    const gg=ctx.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,'#00e5ff'); gg.addColorStop(1,'#7fffb0');
    ctx.fillStyle=gg; ctx.fillRect(bx,by,fillW,bh);
    pixText('XP', bx-30, by+1, 9, '#cfe9ff', '#0a1430');
    // banner toast
    if(bannerT>0){ const a=Math.min(1,bannerT); ctx.globalAlpha=a;
      const tw=bannerText.length*11+28; const bxx=VW/2-tw/2;
      ctx.fillStyle='#2a1538'; ctx.fillRect(bxx-3, 80, tw+6, 30);
      ctx.fillStyle='#f4ecd0'; ctx.fillRect(bxx, 83, tw, 24);
      pixText(bannerText, bxx+14, 90, 10, '#7a1538', null);
      ctx.globalAlpha=1; }
    ctx.restore();
  }
  function heart(x,y,full){
    ctx.fillStyle = full ? '#ff3b5c' : '#5a2030';
    // simple pixel heart
    ctx.fillRect(x+3,y,6,4); ctx.fillRect(x+13,y,6,4);
    ctx.fillRect(x,y+3,22,7); ctx.fillRect(x+2,y+10,18,4);
    ctx.fillRect(x+5,y+14,12,3); ctx.fillRect(x+8,y+17,6,3);
    if(full){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(x+4,y+3,4,3); }
  }
  function star(x,y,full){
    ctx.fillStyle = full ? '#ffd23f' : '#4a4020';
    ctx.beginPath();
    for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5; const a2=a+Math.PI/5;
      ctx.lineTo(x+8+Math.cos(a)*8, y+8+Math.sin(a)*8); ctx.lineTo(x+8+Math.cos(a2)*3.4, y+8+Math.sin(a2)*3.4); }
    ctx.closePath(); ctx.fill();
  }
  function pixText(t,x,y,size,fill,shadow){
    ctx.font = size+"px 'Press Start 2P', monospace"; ctx.textBaseline='top';
    if(shadow){ ctx.fillStyle=shadow; ctx.fillText(t,x+2,y+2); }
    ctx.fillStyle=fill; ctx.fillText(t,x,y);
  }

  // ---------- Intro (start screen) composition ----------
  function introCoins(cx,y,n,gap,h){
    const im=IMG.coin; if(!im) return; const half=(n-1)/2;
    for(let i=0;i<n;i++){ const t=i-half; const cxx=cx+i*gap;
      const cyy=y-Math.round(h*(1-(t*t)/((half*half)||1)));
      const sq=Math.abs(Math.cos(clock*4+i)); const w=Math.max(7,26*sq+6), hh=30;
      ctx.drawImage(im, Math.round(cxx-w/2), Math.round(cyy-hh/2), Math.round(w), Math.round(hh)); }
  }
  function drawCharAt(cx, key, dh){
    const im=IMG[key]||IMG.idle; if(!im) return;
    const bob=Math.round(Math.sin(clock*2.2)*3);
    const dw=im.width/im.height*dh;
    ctx.save(); ctx.imageSmoothingEnabled=true;
    ctx.drawImage(im, Math.round(cx-dw/2), Math.round(GROUND_TOP-dh+2+bob), Math.round(dw), Math.round(dh));
    ctx.restore();
  }
  function drawIntroScene(){
    cam.x=0; cam.y=0;
    drawBackground();
    drawGround();
    // LEFT — start sign + hero character + a few guiding coins
    drawSign(30);
    introCoins(312, 372, 3, 44, 34);
    drawCharAt(210, 'idle', 108);
    // RIGHT — short pipe + platform + trophy (goal preview)
    const ph=84, pp=IMG.pipeShort, pw=pp? pp.width/pp.height*ph : 54;
    drawImg('pipeShort', 628, GROUND_TOP-ph, pw, ph);
    const fp=IMG.floatLg, fw=fp?fp.width:208, fh=fp?fp.height:72;
    drawImg('floatLg', 760, 300, fw, fh);
    const tImg=IMG.trophy;
    if(tImg){ const th=104, tw=tImg.width/tImg.height*th;
      ctx.drawImage(tImg, Math.round(760+(fw-tw)/2), Math.round(312-th), Math.round(tw), Math.round(th)); }
  }

  // ---------- World render ----------
  function drawWorld(){
    drawBackground();
    drawSign(level.signX);
    for(const d of level.deco) drawImg(d.img, d.x, d.y, d.dw, d.dh);   // trophy
    drawGround();
    drawGoal(level.goalX);                                             // procedural goal/unlock area
    for(const o of level.oneway) drawImg(o.img, o.x, o.y, o.dw, o.dh); // grass steps
    for(const s of level.solids) drawImg(s.img, s.x, s.y, s.dw, s.dh); // pipes
    for(const gf of level.gifts) drawGift(gf);
    for(const c of level.coins){ if(!c.got) drawCoin(c); }
    for(const s of level.skills) drawSkill(s);
    for(const sp of level.spikes) drawSpike(sp);
    for(const e of level.enemies) drawEnemy(e);
    drawParticles();
    drawPlayer();
  }

  // ---------- Main loop ----------
  function render(){
    ctx.setTransform(RS,0,0,RS,0,0);
    ctx.clearRect(0,0,VW,VH);
    let sx=0, sy=0;
    if(shake>0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }
    ctx.save(); ctx.translate(Math.round(sx),Math.round(sy));
    if(state==='title') drawIntroScene(); else drawWorld();
    ctx.restore();

    // low-HP vignette
    if(vignette>0.01){ const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.3, VW/2,VH/2,VH*0.75);
      vg.addColorStop(0,'rgba(255,0,40,0)'); vg.addColorStop(1,'rgba(255,0,40,'+vignette.toFixed(2)+')');
      ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH); }

    if(state==='play' || state==='pause') drawHUD();
  }

  let last=0, acc=0; const STEP=1/120;
  function frame(ts){
    if(!last) last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.1)dt=0.1;
    clock+=dt;
    if(bannerT>0) bannerT-=dt;
    if(state==='play'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; } }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- State / screens ----------
  function show(id, on){ document.getElementById(id).classList.toggle('dq-hidden', !on); }
  function startGame(){ ac()&&ac().resume&&ac().resume(); newGame(); state='play';
    show('scr-title',false); show('scr-win',false); show('scr-over',false); show('scr-pause',false); show('scr-load',false); }
  function win(){ state='win'; SFX.win();
    document.getElementById('win-stats').innerHTML =
      'SKILLS &nbsp;'+stars+'/'+TOTAL_SKILLS+'<br>COINS &nbsp;'+coinCount+'<br>TIME &nbsp;'+elapsed.toFixed(1)+'s';
    show('scr-win',true); }
  function gameOver(){ state='over'; SFX.over();
    document.getElementById('over-stats').innerHTML =
      'SKILLS '+stars+'/'+TOTAL_SKILLS+' · COINS '+coinCount+'<br>YOU CAN DO IT — RETRY!';
    show('scr-over',true); }
  function togglePause(){ if(state==='play'){ state='pause'; show('scr-pause',true); }
    else if(state==='pause'){ state='play'; show('scr-pause',false); } }

  document.getElementById('btn-start').onclick = startGame;
  document.getElementById('btn-replay').onclick = startGame;
  document.getElementById('btn-retry').onclick = startGame;
  document.getElementById('btn-resume').onclick = togglePause;
  document.querySelector('.dq-win-x').onclick = ()=>{};

  // ---------- Responsive scaling ----------
  function fit(){
    const ww=window.innerWidth, wh=window.innerHeight;
    const scale=Math.min(ww/VW, wh/VH);
    const w=Math.round(VW*scale), h=Math.round(VH*scale);
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    const stage=document.getElementById('dq-stage');
    stage.style.width=w+'px'; stage.style.height=h+'px';
    document.querySelectorAll('.dq-screen').forEach(s=>{ s.style.fontSize=(scale).toFixed(3)+'rem'; });
  }
  window.addEventListener('resize', fit);

  // ---------- Boot ----------
  // need level for render even on title -> build a preview level after load
  loadAll(()=>{
    level = buildLevel(); resetPlayer(); cam={x:0,y:0};
    lives=3; stars=0; coinCount=0; particles=[]; vignette=0;
    show('scr-load',false); fit();
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
