<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="acA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FC4FF"/>
      <stop offset="100%" stop-color="#2F6FD0"/>
    </linearGradient>
    <linearGradient id="acB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A0FF"/>
      <stop offset="100%" stop-color="#7A3FD0"/>
    </linearGradient>
    <linearGradient id="acC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9AC6"/>
      <stop offset="100%" stop-color="#D6357F"/>
    </linearGradient>
    <linearGradient id="acShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fanned card stack: back card -->
  <g transform="rotate(-17 16 20)">
    <rect x="8.5" y="6" width="15" height="21" rx="2.2" fill="url(#acA)" stroke="#16345E" stroke-width="1"/>
  </g>
  <!-- middle card -->
  <g transform="rotate(-6 16 20)">
    <rect x="8.5" y="5" width="15" height="21" rx="2.2" fill="url(#acB)" stroke="#3B1A6B" stroke-width="1"/>
  </g>
  <!-- front card -->
  <g transform="rotate(6 16 20)">
    <rect x="8.5" y="4" width="15" height="21" rx="2.2" fill="url(#acC)" stroke="#6E1340" stroke-width="1"/>
    <!-- artwork window -->
    <rect x="10.5" y="6.2" width="11" height="11" rx="1.2" fill="#2A0E22" opacity=".55"/>
    <circle cx="16" cy="10.6" r="2.1" fill="#FFE0AA"/>
    <path d="M11.3 17.2l3.1-4.1 2.3 2.7 1.8-1.9 2.2 3.3z" fill="#FFE0AA" opacity=".85"/>
    <!-- rank marks -->
    <rect x="10.8" y="19" width="7" height="1.5" rx=".75" fill="#FFFFFF" opacity=".7"/>
    <rect x="10.8" y="21.4" width="4.6" height="1.5" rx=".75" fill="#FFFFFF" opacity=".45"/>
    <path d="M8.5 6.2a2.2 2.2 0 0 1 2.2-2.2h6L8.5 13z" fill="url(#acShine)"/>
  </g>
</svg>
